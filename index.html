<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="DineQR restaurant ordering platform">
  <title>DineQR — Restaurant ordering, simplified</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root{--ink:#17241d;--ink2:#263a30;--orange:#ed6b35;--orange2:#d95724;--cream:#f6f5f0;--paper:#fff;--muted:#6e776f;--line:#e4e6e1;--green:#237653;--greenbg:#e7f3eb;--amber:#a87314;--amberbg:#fff3d5;--red:#b34827;--redbg:#fff0ea;--shadow:0 16px 45px rgba(28,48,37,.09)}
    *{box-sizing:border-box}html{background:var(--cream)}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.sidebar{position:sticky;top:0;height:100vh;background:var(--ink);color:#fff;padding:24px 17px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;letter-spacing:-1px}.logo{width:36px;height:36px;border-radius:11px 11px 11px 3px;background:var(--orange);display:grid;place-items:center;color:#fff;font:italic 23px Georgia,serif}.restaurant{margin:28px 0 20px;padding:12px;border:1px solid #3a5043;background:#25372e;border-radius:12px;display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:9px;background:#f0c6a5;color:#6d3c24;display:grid;place-items:center;font-weight:800;font-size:10px}.restaurant small,.user small{font-size:8px;letter-spacing:1px;color:#aebbb3}.restaurant strong,.user strong{display:block;font-size:11px;margin-top:3px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#b9c4bd;border-radius:9px;padding:11px 12px;text-align:left;font-size:12px}.nav button:hover,.nav button.active{background:#2c4035;color:#fff}.nav button span{display:inline-block;width:24px;color:#ff9366}.sidebar-foot{margin-top:auto}.help{padding:15px;border-radius:12px;background:#efc7a5;color:#4f3020}.help strong{font-size:12px}.help p{font-size:9px;line-height:1.5;margin:5px 0 10px}.help button{width:100%;border:0;border-radius:7px;background:#fff8f2;color:#5a3927;padding:8px;font-weight:700;font-size:9px}.user{margin-top:15px;padding-top:14px;border-top:1px solid #35483e;display:flex;gap:9px;align-items:center}.user .avatar{border-radius:50%;background:#dce6df;color:#365344}.main{min-width:0}.topbar{height:86px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.topbar h1{margin:0;font-size:20px;letter-spacing:-.5px}.topbar p{margin:4px 0 0;color:var(--muted);font-size:10px}.rolebox{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:9px}.rolebox select{border:1px solid var(--line);background:#fafaf8;padding:8px 28px 8px 10px;border-radius:8px;color:var(--ink);font-size:10px;font-weight:700}.content{max-width:1400px;margin:auto;padding:28px 34px 55px}.hero{border-radius:18px;background:linear-gradient(120deg,var(--ink),#284634);color:#fff;padding:38px 42px;min-height:240px;display:flex;align-items:center;justify-content:space-between;overflow:hidden}.hero h2{font:500 40px/1.03 Georgia,serif;margin:12px 0}.hero p{max-width:540px;color:#bdc8c1;font-size:12px;line-height:1.6}.eyebrow{color:var(--orange);font-size:8px;font-weight:800;letter-spacing:1.5px}.hero-art{position:relative;width:250px;height:180px;display:grid;place-items:center}.hero-art:before,.hero-art:after{content:"";position:absolute;border:1px solid #496353;border-radius:50%}.hero-art:before{width:180px;height:180px}.hero-art:after{width:280px;height:280px}.hero-art b{position:relative;z-index:1;font:italic 60px Georgia,serif}.button{border:0;border-radius:9px;padding:10px 14px;font-size:10px;font-weight:800}.button.primary{background:var(--orange);color:#fff}.button.primary:hover{background:var(--orange2)}.button.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.button.light{background:#fff;color:var(--ink)}.button.danger{background:var(--redbg);color:var(--red);border:1px solid #f0c5b8}.hero .button{margin-top:12px}.section{margin-top:28px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;gap:15px}.section-head h2{font-size:16px;margin:0 0 4px}.section-head p{font-size:9px;color:var(--muted);margin:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.metric,.panel,.table-card,.order-card,.menu-card{background:#fff;border:1px solid var(--line);border-radius:14px}.metric{padding:18px}.metric small{font-size:9px;color:var(--muted)}.metric strong{display:block;font-size:24px;margin:7px 0 5px;letter-spacing:-1px}.metric em{font-style:normal;font-size:8px;color:var(--green)}.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:15px}.panel{padding:19px}.activity{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:13px 0;border-top:1px solid #eceeea}.activity i{width:8px;height:8px;border-radius:50%;background:var(--orange)}.activity strong{font-size:10px}.activity small{display:block;color:var(--muted);font-size:8px;margin-top:4px}.activity b{font-size:10px}.tables,.orders,.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.table-card,.order-card,.menu-card{padding:18px}.table-card.open{border-top:3px solid var(--green)}.table-card.bill{border-top:3px solid #e1ad3c}.state{display:inline-block;border-radius:20px;padding:5px 8px;font-size:8px;font-style:normal;text-transform:uppercase}.state.available{background:#eef0ed;color:#69716b}.state.open,.state.accepted,.state.served{background:var(--greenbg);color:var(--green)}.state.bill,.state.pending{background:var(--amberbg);color:var(--amber)}.state.preparing,.state.ready{background:#eaf0fa;color:#3e6dab}.state.rejected,.state.voided{background:var(--redbg);color:var(--red)}.table-card h3,.order-card h3,.menu-card h3{margin:15px 0 5px;font-size:15px}.table-card p,.order-card p,.menu-card p{font-size:9px;color:var(--muted);line-height:1.5;min-height:28px}.actions{display:flex;gap:7px;margin-top:14px}.actions .button{flex:1}.order-card header{display:flex;align-items:center;justify-content:space-between}.order-card header small{display:block;color:var(--muted);font-size:8px;margin-top:3px}.order-card footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #eceeea;padding-top:12px}.order-card footer div{display:flex;gap:5px}.menu-card .price{font-size:14px;font-weight:800}.menu-card footer{display:flex;justify-content:space-between;align-items:center}.menu-pic{height:85px;border-radius:10px;background:linear-gradient(140deg,#d59a73,#68432d);display:flex;align-items:end;padding:9px;color:#fff;font-size:8px}.menu-card:nth-child(2n) .menu-pic{background:linear-gradient(140deg,#d5c28d,#62543d)}.menu-card:nth-child(3n) .menu-pic{background:linear-gradient(140deg,#b8c98d,#52633e)}.add{width:30px;height:30px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-size:18px}.company-table{width:100%;border-collapse:collapse;font-size:10px}.company-table th{text-align:left;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:1px;padding:8px}.company-table td{padding:13px 8px;border-top:1px solid #eceeea}.company-table td strong{display:block}.company-table td small{color:var(--muted);font-size:8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form label{font-size:9px;font-weight:700}.form input,.form select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:#fbfbf9;padding:10px}.form .wide{grid-column:1/-1}.customer{min-height:100vh;background:#fbfaf6}.customer-head{height:76px;padding:0 5vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.customer-head .brand{color:var(--ink)}.customer-hero{padding:52px 6vw;background:linear-gradient(110deg,#f3dfcd,#f5eee2 55%,#e5eadf)}.customer-hero h1{font:500 47px/1 Georgia,serif;margin:12px 0}.customer-hero h1 i{color:var(--orange2)}.customer-hero p{font-size:11px;color:var(--muted);max-width:520px;line-height:1.6}.customer-body{padding:30px 5vw 50px;display:grid;grid-template-columns:1fr 300px;gap:26px}.customer .menu-grid{grid-template-columns:repeat(2,1fr)}.cart{position:sticky;top:15px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:19px}.cart h2{font:500 24px Georgia,serif}.cart-empty{text-align:center;padding:40px 10px;border-block:1px solid #eceeea;color:var(--muted);font-size:10px}.cart-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid #eceeea;font-size:9px}.cart-total{display:flex;justify-content:space-between;padding:15px 0;font-weight:800}.requestbar{display:flex;gap:8px;margin-top:18px}.requestbar button{border:1px solid #d9d8d1;border-radius:20px;background:#fff9;padding:8px 11px;font-size:9px}.modal-bg{position:fixed;inset:0;background:#08110caa;display:grid;place-items:center;padding:18px;z-index:20}.modal{background:#fff;border-radius:16px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 30px 90px #0005}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:17px}.close{border:0;background:#eff1ed;border-radius:8px;width:31px;height:31px;font-size:18px}.qr{text-align:center}.qr h3{font:500 25px Georgia,serif;margin:14px 0 5px}.qr p{font-size:10px;color:var(--muted)}#qrcode{display:grid;place-items:center;margin:17px auto}#qrcode img,#qrcode canvas{max-width:220px}.receipt{max-width:340px;margin:auto}.receipt h3{text-align:center;font:500 24px Georgia,serif}.receipt-line{display:flex;justify-content:space-between;padding:8px 0;font-size:10px;border-top:1px dashed #d6d9d4}.receipt-line.total{font-size:14px;font-weight:800;border-top:2px solid var(--ink);margin-top:8px}.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;border-radius:10px;padding:13px 16px;font-size:10px;box-shadow:var(--shadow);z-index:30}.simple-note{background:#fff8e8;border:1px solid #f0ddb4;color:#76571c;padding:11px 13px;border-radius:10px;font-size:9px;margin-bottom:18px}
    @media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}.tables,.orders,.menu-grid{grid-template-columns:repeat(2,1fr)}.customer-body{grid-template-columns:1fr}.cart{position:static}}
    @media(max-width:720px){.shell{display:block}.sidebar{position:static;height:auto}.restaurant,.sidebar-foot{display:none}.nav{flex-direction:row;overflow:auto;margin-top:15px}.nav button{white-space:nowrap}.topbar{padding:16px 18px;height:auto}.topbar p{display:none}.content{padding:20px 16px 40px}.hero{padding:30px;min-height:280px}.hero h2{font-size:34px}.hero-art{display:none}.grid2{grid-template-columns:1fr}.customer-body{padding:24px 16px}.customer-hero{padding:42px 20px}.customer .menu-grid{grid-template-columns:1fr 1fr}}
    @media(max-width:480px){.metrics,.tables,.orders,.menu-grid,.customer .menu-grid,.form{grid-template-columns:1fr}.hero h2,.customer-hero h1{font-size:36px}.rolebox span{display:none}.form .wide{grid-column:auto}.company-table th:nth-child(2),.company-table td:nth-child(2){display:none}}
    @media print{.sidebar,.topbar,.modal-head,.toast{display:none!important}.shell{display:block}.content{display:none}.modal-bg{position:static;background:#fff}.modal{box-shadow:none;width:100%}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>
  <script>
    const state={role:'superadmin',view:'overview',company:'Ember & Oak',tax:8.5,service:10,cart:[],companies:[{name:'Ember & Oak',owner:'Jordan Ellis',email:'jordan@emberandoak.com',status:'Active'},{name:'Salt & Stone',owner:'Maya Rivera',email:'maya@saltandstone.com',status:'Active'}],tables:[{id:1,name:'Table 01',seats:2,status:'open',token:'demo-table-1'},{id:2,name:'Table 02',seats:4,status:'available'},{id:3,name:'Table 03',seats:4,status:'bill'},{id:4,name:'Table 04',seats:6,status:'available'},{id:5,name:'Table 05',seats:2,status:'open',token:'demo-table-5'},{id:6,name:'Patio 01',seats:4,status:'available'}],orders:[{id:'#1048',table:'Table 01',items:'2 × Fire-roasted chicken, 1 × House lemonade',total:53,status:'pending'},{id:'#1047',table:'Table 05',items:'1 × Wild mushroom rigatoni, 1 × Burrata & tomatoes',total:34,status:'accepted'},{id:'#1046',table:'Table 03',items:'2 × Charred corn ribs, 2 × House lemonade',total:32,status:'ready'}],menu:[{id:1,name:'Fire-roasted chicken',description:'Herb jus, crispy potatoes and seasonal greens',price:24,category:'Mains'},{id:2,name:'Wild mushroom rigatoni',description:'Parmesan cream, thyme and toasted hazelnuts',price:19,category:'Mains'},{id:3,name:'Charred corn ribs',description:'Smoked lime butter and chilli salt',price:11,category:'Small plates'},{id:4,name:'Burrata & tomatoes',description:'Basil oil, aged balsamic and sourdough',price:15,category:'Small plates'},{id:5,name:'Burnt honey cheesecake',description:'Vanilla cream and citrus',price:10,category:'Dessert'},{id:6,name:'House lemonade',description:'Fresh lemon, mint and sparkling water',price:5,category:'Drinks'}]};
    const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const nav={superadmin:[['overview','⌂','Platform'],['companies','▦','Companies']],owner:[['overview','⌂','Overview'],['tables','▦','Tables'],['orders','◫','Orders'],['menu','≡','Menu'],['finance','$','Finances'],['settings','⚙','Settings']],waiter:[['overview','⌂','Overview'],['tables','▦','Tables'],['orders','◫','Orders']],kitchen:[['orders','◫','Kitchen board']],cashier:[['tables','▦','Tables'],['finance','$','Payments']]};
    function toast(message){const t=document.getElementById('toast');t.textContent='✓ '+message;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
    function setRole(role){state.role=role;state.view=role==='kitchen'?'orders':role==='cashier'?'tables':'overview';render()}
    function setView(view){state.view=view;render()}
    function shell(content,title){return `<div class="shell"><aside class="sidebar"><div class="brand"><span class="logo">D</span>DineQR</div><div class="restaurant"><span class="avatar">${state.role==='superadmin'?'DQ':state.company.slice(0,2).toUpperCase()}</span><span><small>${state.role==='superadmin'?'SUPER ADMIN':'RESTAURANT'}</small><strong>${state.role==='superadmin'?'DineQR Platform':esc(state.company)}</strong></span></div><nav class="nav">${nav[state.role].map(n=>`<button class="${state.view===n[0]?'active':''}" onclick="setView('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav><div class="sidebar-foot"><div class="help"><strong>Simple GitHub version</strong><p>This version works directly from one index.html file.</p><button onclick="toast('DineQR is running correctly.')">Check website</button></div><div class="user"><span class="avatar">AM</span><span><small>ACCOUNT</small><strong>Alex Morgan</strong></span></div></div></aside><main class="main"><header class="topbar"><div><h1>${title}</h1><p>${state.role==='superadmin'?'Manage every restaurant on DineQR.':esc(state.company)+' · Restaurant workspace'}</p></div><label class="rolebox"><span>View as</span><select onchange="setRole(this.value)"><option value="superadmin" ${state.role==='superadmin'?'selected':''}>Super Admin</option><option value="owner" ${state.role==='owner'?'selected':''}>Owner</option><option value="waiter" ${state.role==='waiter'?'selected':''}>Waiter</option><option value="kitchen" ${state.role==='kitchen'?'selected':''}>Kitchen</option><option value="cashier" ${state.role==='cashier'?'selected':''}>Cashier</option><option value="customer">Customer</option></select></label></header><div class="content"><div class="simple-note">This simplified GitHub Pages version needs no Node.js and no deployment workflow.</div>${content}</div></main></div>`}
    function metric(label,value,note){return `<article class="metric"><small>${label}</small><strong>${value}</strong><em>${note}</em></article>`}
    function overview(){if(state.role==='superadmin')return shell(`<section class="hero"><div><span class="eyebrow">DINEQR CONTROL CENTRE</span><h2>Restaurants thrive.<br>You stay in control.</h2><p>Create restaurant companies, assign owners and manage the platform from one clear workspace.</p><button class="button light" onclick="companyModal()">＋ Add company</button></div><div class="hero-art"><b>D<span style="color:var(--orange)">Q</span></b></div></section><section class="section"><div class="section-head"><div><h2>Platform at a glance</h2><p>Current activity across DineQR.</p></div></div><div class="metrics">${metric('Restaurant companies',state.companies.length,'Platform total')}${metric('Active table sessions',state.tables.filter(t=>t.status!=='available').length,'Live now')}${metric('Orders today','184','↑ 12.6%')}${metric('Recorded offline','$8,420','Today')}</div></section><section class="section grid2"><div class="panel"><div class="section-head"><div><h2>Restaurant companies</h2><p>Companies and their owners.</p></div><button class="button primary" onclick="companyModal()">Add company</button></div>${companyTable()}</div><div class="panel"><div class="section-head"><div><h2>Live activity</h2><p>What is happening now.</p></div></div><div class="activity"><i></i><span><strong>New order at Ember & Oak</strong><small>Table 01 · 2 min ago</small></span><b>$53</b></div><div class="activity"><i style="background:var(--green)"></i><span><strong>Table closed at Salt & Stone</strong><small>Table 08 · 8 min ago</small></span><b>$126</b></div></div></section>`,'Platform overview');
      return shell(`<section class="hero"><div><span class="eyebrow">LIVE AT ${esc(state.company.toUpperCase())}</span><h2>Your floor is moving smoothly.</h2><p>${state.tables.filter(t=>t.status!=='available').length} tables are active and ${state.orders.filter(o=>o.status==='pending').length} order needs attention.</p><button class="button light" onclick="setView('tables')">Manage tables</button></div><div class="hero-art"><b>${esc(state.company.slice(0,2))}</b></div></section><section class="section"><div class="metrics">${metric('Sales today','$2,840','↑ 8.2%')}${metric('Open tables',state.tables.filter(t=>t.status!=='available').length+'/'+state.tables.length,'Floor capacity')}${metric('Pending approval',state.orders.filter(o=>o.status==='pending').length,'Needs a waiter')}${metric('Average bill','$71.40','Today')}</div></section><section class="section grid2"><div class="panel"><div class="section-head"><div><h2>Orders needing attention</h2><p>Waiter approval queue.</p></div><button class="button secondary" onclick="setView('orders')">All orders</button></div>${state.orders.map(o=>`<div class="activity"><i></i><span><strong>${o.table} · ${o.id}</strong><small>${o.items}</small></span><b>${money(o.total)}</b></div>`).join('')}</div><div class="panel"><div class="section-head"><div><h2>Table pulse</h2><p>Dining room status.</p></div></div><div class="tables" style="grid-template-columns:repeat(2,1fr)">${state.tables.map(t=>`<div class="table-card ${t.status}"><strong>${t.name}</strong><br><em class="state ${t.status}">${t.status}</em></div>`).join('')}</div></div></section>`,'Good afternoon');}
    function companyTable(){return `<table class="company-table"><thead><tr><th>Company</th><th>Owner</th><th>Status</th></tr></thead><tbody>${state.companies.map(c=>`<tr><td><strong>${esc(c.name)}</strong><small>${esc(c.email)}</small></td><td>${esc(c.owner)}</td><td><em class="state open">${c.status}</em></td></tr>`).join('')}</tbody></table>`}
    function companies(){return shell(`<section class="section" style="margin-top:0"><div class="section-head"><div><h2>Restaurant companies</h2><p>Add a company and assign its owner.</p></div><button class="button primary" onclick="companyModal()">＋ Add company</button></div><div class="panel">${companyTable()}</div></section>`,'Companies')}
    function tables(){return shell(`<section class="section" style="margin-top:0"><div class="section-head"><div><h2>Dining room</h2><p>Opening a table generates a new single-use QR link.</p></div></div><div class="tables">${state.tables.map(t=>`<article class="table-card ${t.status}"><em class="state ${t.status}">${t.status==='bill'?'bill requested':t.status}</em><h3>${t.name}</h3><p>${t.seats} seats · ${t.status==='available'?'Ready for new guests':'Active dining session'}</p>${t.status==='available'?`<button class="button primary" onclick="openTable(${t.id})">Open table & QR</button>`:`<div class="actions"><button class="button secondary" onclick="showQr(${t.id})">View QR</button><button class="button danger" onclick="closeTable(${t.id})">Close</button></div>`}</article>`).join('')}</div></section>`,'Tables')}
    function orders(){let list=state.role==='kitchen'?state.orders.filter(o=>!['pending','rejected'].includes(o.status)):state.orders;return shell(`<section class="section" style="margin-top:0"><div class="section-head"><div><h2>${state.role==='kitchen'?'Kitchen board':'Live orders'}</h2><p>${state.role==='kitchen'?'Only waiter-approved orders appear here.':'Accept customer orders before they reach the kitchen.'}</p></div></div><div class="orders">${list.map(o=>`<article class="order-card"><header><span><strong>${o.table}</strong><small>${o.id} · Just now</small></span><em class="state ${o.status}">${o.status}</em></header><p>${o.items}</p><footer><b>${money(o.total)}</b><div>${orderButtons(o)}</div></footer></article>`).join('')}</div></section>`,'Orders')}
    function orderButtons(o){if(o.status==='pending')return `<button class="button danger" onclick="updateOrder('${o.id}','rejected')">Reject</button><button class="button primary" onclick="updateOrder('${o.id}','accepted')">Accept</button>`;if(o.status==='accepted')return `<button class="button primary" onclick="updateOrder('${o.id}','preparing')">Start</button>`;if(o.status==='preparing')return `<button class="button primary" onclick="updateOrder('${o.id}','ready')">Ready</button>`;if(o.status==='ready')return `<button class="button secondary" onclick="updateOrder('${o.id}','served')">Served</button>`;return ''}
    function menu(){return shell(`<section class="section" style="margin-top:0"><div class="section-head"><div><h2>Menu</h2><p>Simple items with a description and USD price.</p></div><button class="button primary" onclick="menuModal()">＋ Add item</button></div><div class="menu-grid">${state.menu.map((m,i)=>menuCard(m,i,false)).join('')}</div></section>`,'Menu')}
    function menuCard(m,i,customer){return `<article class="menu-card"><div class="menu-pic">${esc(m.category)}</div><h3>${esc(m.name)}</h3><p>${esc(m.description)}</p><footer><span class="price">${money(m.price)}</span>${customer?`<button class="add" onclick="addCart(${m.id})">＋</button>`:'<em class="state open">Available</em>'}</footer></article>`}
    function finance(){return shell(`<section class="section" style="margin-top:0"><div class="section-head"><div><h2>Finances</h2><p>Offline payments recorded from closed sessions.</p></div></div><div class="metrics">${metric('Gross sales','$24,680','This month')}${metric('Tax collected','$1,941',state.tax+'% configured')}${metric('Service charges','$2,174',state.service+'% configured')}${metric('Discounts','$684','27 applied')}</div></section>`,'Finances')}
    function settings(){return shell(`<section class="section" style="margin-top:0;max-width:720px"><div class="panel"><div class="section-head"><div><h2>Restaurant settings</h2><p>Owner-controlled company and billing settings.</p></div></div><form class="form" onsubmit="saveSettings(event)"><label>Company name<input name="company" value="${esc(state.company)}"></label><label>Currency<select><option>USD — US Dollar</option></select></label><label>Tax added to bill (%)<input name="tax" type="number" value="${state.tax}"></label><label>Service charge (%)<input name="service" type="number" value="${state.service}"></label><button class="button primary">Save settings</button></form></div></section>`,'Settings')}
    function customer(){document.getElementById('app').innerHTML=`<div class="customer"><header class="customer-head"><div class="brand"><span class="logo">D</span>DineQR</div><strong>${esc(state.company)}</strong><button class="button secondary" onclick="setRole('owner')">Staff view</button></header><section class="customer-hero"><span class="eyebrow">WELCOME TO ${esc(state.company.toUpperCase())}</span><h1>Good food,<br><i>at your fingertips.</i></h1><p>Choose what you love. Your waiter will approve the order before it reaches the kitchen.</p><div class="requestbar"><button onclick="toast('Waiter request sent.')">Request waiter</button><button onclick="toast('Bill request sent.')">Request the bill</button></div></section><div class="customer-body"><div class="menu-grid">${state.menu.map((m,i)=>menuCard(m,i,true)).join('')}</div><aside class="cart"><span class="eyebrow">TABLE 01</span><h2>Your order</h2><div id="cartItems">${cartHtml()}</div><div class="cart-total"><span>Subtotal</span><b>${money(state.cart.reduce((s,x)=>s+x.price*x.qty,0))}</b></div><button class="button primary" style="width:100%" ${state.cart.length?'':'disabled'} onclick="submitOrder()">Send order for approval</button></aside></div></div>`}
    function cartHtml(){if(!state.cart.length)return `<div class="cart-empty">Your cart is waiting.<br>Add something delicious.</div>`;return state.cart.map(x=>`<div class="cart-row"><span>${x.qty} × ${esc(x.name)}</span><b>${money(x.price*x.qty)}</b></div>`).join('')}
    function addCart(id){const m=state.menu.find(x=>x.id===id),found=state.cart.find(x=>x.id===id);if(found)found.qty++;else state.cart.push({...m,qty:1});customer();toast(m.name+' added.')}
    function submitOrder(){const total=state.cart.reduce((s,x)=>s+x.price*x.qty,0);state.orders.unshift({id:'#'+(1050+state.orders.length),table:'Table 01',items:state.cart.map(x=>x.qty+' × '+x.name).join(', '),total,status:'pending'});state.cart=[];customer();toast('Order sent to your waiter for approval.')}
    function openTable(id){const t=state.tables.find(x=>x.id===id);t.status='open';t.token='dineqr-'+id+'-'+Date.now().toString(36);render();showQr(id)}
    function showQr(id){const t=state.tables.find(x=>x.id===id);modal(`<div class="qr"><em class="state open">Active session</em><h3>${esc(state.company)}</h3><p>${t.name} · This QR expires when the table closes.</p><div id="qrcode"></div><button class="button primary" onclick="window.print()">Print QR code</button></div>`,'Table QR');setTimeout(()=>{const el=document.getElementById('qrcode');if(window.QRCode)new QRCode(el,{text:location.href.split('?')[0]+'?session='+t.token,width:220,height:220,colorDark:'#17241d'});else el.textContent=location.href+'?session='+t.token},20)}
    function closeTable(id){const t=state.tables.find(x=>x.id===id);if(state.orders.some(o=>o.table===t.name&&o.status==='pending'))return toast('Resolve pending orders before closing.');const subtotal=state.orders.filter(o=>o.table===t.name&&!['pending','rejected','voided'].includes(o.status)).reduce((s,o)=>s+o.total,0),tax=subtotal*state.tax/100,service=subtotal*state.service/100;t.status='available';delete t.token;modal(`<div class="receipt"><h3>${esc(state.company)}</h3><p style="text-align:center;color:var(--muted);font-size:9px">${t.name} · Final receipt</p><div class="receipt-line"><span>Accepted orders</span><b>${money(subtotal)}</b></div><div class="receipt-line"><span>Tax (${state.tax}%)</span><b>${money(tax)}</b></div><div class="receipt-line"><span>Service (${state.service}%)</span><b>${money(service)}</b></div><div class="receipt-line total"><span>Total</span><b>${money(subtotal+tax+service)}</b></div><p style="font-size:9px;text-align:center">The previous QR link has expired.</p><button class="button primary" style="width:100%" onclick="window.print()">Print receipt</button></div>`,'Receipt')}
    function updateOrder(id,status){state.orders.find(o=>o.id===id).status=status;render();toast('Order moved to '+status+'.')}
    function companyModal(){modal(`<form class="form" onsubmit="addCompany(event)"><label>Company name<input name="company" required placeholder="Restaurant name"></label><label>Owner name<input name="owner" required placeholder="Owner full name"></label><label class="wide">Owner email<input name="email" type="email" required placeholder="owner@restaurant.com"></label><button class="button primary">Create company</button></form>`,'Add restaurant company')}
    function addCompany(e){e.preventDefault();const d=new FormData(e.target),c={name:d.get('company'),owner:d.get('owner'),email:d.get('email'),status:'Active'};state.companies.unshift(c);state.company=c.name;closeModal();render();toast(c.name+' created.')}
    function menuModal(){modal(`<form class="form" onsubmit="addMenu(event)"><label>Item name<input name="name" required></label><label>Category<select name="category"><option>Mains</option><option>Small plates</option><option>Dessert</option><option>Drinks</option></select></label><label class="wide">Description<input name="description" required></label><label>Price (USD)<input name="price" type="number" step=".01" required></label><button class="button primary">Add item</button></form>`,'Add menu item')}
    function addMenu(e){e.preventDefault();const d=new FormData(e.target);state.menu.push({id:Date.now(),name:d.get('name'),category:d.get('category'),description:d.get('description'),price:Number(d.get('price'))});closeModal();render();toast('Menu item added.')}
    function saveSettings(e){e.preventDefault();const d=new FormData(e.target);state.company=d.get('company');state.tax=Number(d.get('tax'));state.service=Number(d.get('service'));render();toast('Settings saved.')}
    function modal(body,title){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
    function render(){if(state.role==='customer')return customer();const routes={overview,companies,tables,orders,menu,finance,settings};document.getElementById('app').innerHTML=(routes[state.view]||overview)()}
    render();
  </script>
</body>
</html>
