<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DineQR Menu</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0a0a0f',
                        charcoal: '#13131f',
                        slate: '#1a1a2e',
                        panel: '#16162a',
                        neon: '#00ff88',
                        'neon-dim': '#00cc6a',
                        'neon-glow': 'rgba(0,255,136,0.15)',
                        cyber: '#0ea5e9',
                        'cyber-dim': '#0284c7',
                        surface: 'rgba(255,255,255,0.03)',
                        'surface-hover': 'rgba(255,255,255,0.06)',
                        'surface-active': 'rgba(255,255,255,0.08)',
                        muted: '#6b7280',
                        'muted-light': '#9ca3af',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s ease-in-out infinite',
                        'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1)',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'scan': 'scan 2s linear infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 5px rgba(0,255,136,0.3), 0 0 20px rgba(0,255,136,0.1)' },
                            '50%': { boxShadow: '0 0 15px rgba(0,255,136,0.5), 0 0 40px rgba(0,255,136,0.2)' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        scan: {
                            '0%': { transform: 'translateY(-100%)' },
                            '100%': { transform: 'translateY(100%)' },
                        },
                    },
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', system-ui, sans-serif; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(0,255,136,0.4); }

        /* Glassmorphism utilities */
        .glass {
            background: rgba(22, 22, 42, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .glass-strong {
            background: rgba(22, 22, 42, 0.85);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* Neon glow effects */
        .neon-border {
            border: 1px solid rgba(0,255,136,0.3);
            box-shadow: 0 0 10px rgba(0,255,136,0.05), inset 0 0 10px rgba(0,255,136,0.02);
        }
        .neon-border-hover:hover {
            border-color: rgba(0,255,136,0.6);
            box-shadow: 0 0 20px rgba(0,255,136,0.15), inset 0 0 20px rgba(0,255,136,0.05);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(0,255,136,0.5), 0 0 30px rgba(0,255,136,0.2);
        }
        .neon-text-subtle {
            text-shadow: 0 0 8px rgba(0,255,136,0.3);
        }

        /* Menu item hover lift */
        .menu-item-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .menu-item-card:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,255,136,0.15);
        }
        .menu-item-card:active {
            transform: translateY(0) scale(0.99);
        }

        /* Category pill */
        .cat-pill {
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .cat-pill::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0,255,136,0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .cat-pill:hover::before { opacity: 1; }
        .cat-pill.active {
            background: linear-gradient(135deg, rgba(0,255,136,0.15), rgba(0,255,136,0.05));
            border-color: rgba(0,255,136,0.5);
            box-shadow: 0 0 15px rgba(0,255,136,0.1);
        }
        .cat-pill.active::before { opacity: 1; }

        /* Add button */
        .add-btn-glow {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            box-shadow: 0 2px 12px rgba(0,255,136,0.3);
            transition: all 0.2s ease;
        }
        .add-btn-glow:hover {
            box-shadow: 0 4px 20px rgba(0,255,136,0.5), 0 0 30px rgba(0,255,136,0.2);
            transform: scale(1.05);
        }
        .add-btn-glow:active {
            transform: scale(0.95);
            box-shadow: 0 1px 8px rgba(0,255,136,0.3);
        }

        /* Cart bar */
        .cart-bar-glass {
            background: linear-gradient(180deg, rgba(22,22,42,0.95), rgba(10,10,15,0.98));
            backdrop-filter: blur(20px) saturate(180%);
            border-top: 1px solid rgba(0,255,136,0.15);
            box-shadow: 0 -4px 30px rgba(0,0,0,0.5), 0 0 20px rgba(0,255,136,0.05);
        }

        /* Cart modal */
        .cart-modal-cyber {
            background: linear-gradient(180deg, #16162a, #13131f);
            border: 1px solid rgba(0,255,136,0.1);
            border-bottom: none;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6), 0 0 30px rgba(0,255,136,0.05);
        }

        /* Place Order Button */
        .place-order-btn {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,255,136,0.3), 0 0 0 1px rgba(0,255,136,0.2);
        }
        .place-order-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }
        .place-order-btn:hover::before {
            left: 100%;
        }
        .place-order-btn:hover {
            box-shadow: 0 6px 30px rgba(0,255,136,0.5), 0 0 0 1px rgba(0,255,136,0.4);
            transform: translateY(-1px);
        }
        .place-order-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 12px rgba(0,255,136,0.3);
        }
        .place-order-btn:disabled {
            background: linear-gradient(135deg, #374151, #1f2937);
            box-shadow: none;
            transform: none;
        }

        /* Dashed receipt border */
        .receipt-divider {
            border-top: 2px dashed rgba(0,255,136,0.2);
            position: relative;
        }
        .receipt-divider::before,
        .receipt-divider::after {
            content: '';
            position: absolute;
            top: -6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #0a0a0f;
        }
        .receipt-divider::before { left: -6px; }
        .receipt-divider::after { right: -6px; }

        /* Loading spinner */
        .cyber-spinner {
            border: 3px solid rgba(0,255,136,0.1);
            border-top-color: #00ff88;
            box-shadow: 0 0 10px rgba(0,255,136,0.2);
        }

        /* Success screen */
        .success-screen-cyber {
            background: radial-gradient(ellipse at center, #16162a 0%, #0a0a0f 100%);
        }
        .success-icon-glow {
            filter: drop-shadow(0 0 20px rgba(0,255,136,0.6)) drop-shadow(0 0 40px rgba(0,255,136,0.3));
        }

        /* Error screen */
        .error-screen-cyber {
            background: radial-gradient(ellipse at center, #1a0a0a 0%, #0a0a0f 100%);
        }

        /* Quantity controls */
        .qty-btn-cyber {
            transition: all 0.2s ease;
            border: 1px solid rgba(0,255,136,0.2);
        }
        .qty-btn-cyber:hover {
            border-color: rgba(0,255,136,0.5);
            background: rgba(0,255,136,0.1);
        }
        .qty-btn-cyber:active {
            transform: scale(0.9);
        }

        /* Image placeholder glow */
        .img-placeholder {
            background: linear-gradient(135deg, rgba(0,255,136,0.05), rgba(14,165,233,0.05));
            border: 1px dashed rgba(0,255,136,0.15);
        }

        /* Scan line effect */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0,255,136,0.5), transparent);
            animation: scan 3s linear infinite;
            pointer-events: none;
        }

        /* Note textarea */
        .note-area {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.2s ease;
        }
        .note-area:focus {
            border-color: rgba(0,255,136,0.3);
            box-shadow: 0 0 10px rgba(0,255,136,0.05);
            outline: none;
        }

        /* Modal overlay */
        .modal-overlay-cyber {
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
        }

        /* Grid pattern background */
        .grid-bg {
            background-image: 
                linear-gradient(rgba(0,255,136,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,136,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
        }
    </style>
<base target="_blank">

<body class="bg-obsidian text-gray-100 min-h-screen pb-24 grid-bg">

    <script>
        const CONFIG = {
            SUPABASE_URL: 'https://yalfwsqfnzunecnmxajq.supabase.co',
            SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhbGZ3c3Fmbnp1bmVjbm14YWpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyNjYwNjUsImV4cCI6MjA5Njg0MjA2NX0.277WcudAYbzA5sG4UpFc9ta8_IVDyn0zxnS85Q35Urc'
        };
        const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        let tableId = null, tableNumber = null, menuData = { categories: [], items: [] }, cart = {}, currentCategory = 'all';

        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            const params = new URLSearchParams(window.location.search);
            tableId = params.get('table'); const token = params.get('token');
            if (!tableId || !token) { showError('Missing Parameters', 'This QR code is missing table information.'); return; }
            try {
                const { data: table, error } = await sb.from('restaurant_tables').select('*').eq('id', tableId).eq('qr_token', token).eq('status', 'occupied').single();
                if (error || !table) { showError('Invalid QR Code', 'This table has been closed. Ask staff for a new QR code.'); return; }
                tableNumber = table.table_number;
                document.getElementById('table-badge').textContent = `Table ${tableNumber}`;
                document.getElementById('success-table').textContent = tableNumber;
                await loadMenu();
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('app').classList.remove('hidden');
                document.getElementById('app').classList.add('block');
                renderMenu();
                lucide.createIcons();
            } catch (e) { console.error(e); showError('Error', 'Could not load menu.'); }
        });

        async function loadMenu() {
            const [{ data: categories }, { data: items }] = await Promise.all([
                sb.from('categories').select('*').order('sort_order'),
                sb.from('menu_items').select('*, categories(name)').eq('available', true).order('name')
            ]);
            menuData.categories = categories || [];
            menuData.items = items || [];
            const scroll = document.getElementById('categories-scroll');
            menuData.categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'cat-pill px-5 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap cursor-pointer border border-white/10 text-muted-light bg-white/5 hover:border-neon/30 hover:text-neon transition-all';
                btn.textContent = cat.name;
                btn.dataset.cat = cat.id;
                btn.onclick = () => filterCategory(cat.id);
                scroll.appendChild(btn);
            });
        }

        function renderMenu() {
            const container = document.getElementById('menu-container'); container.innerHTML = '';
            const cats = currentCategory === 'all' ? menuData.categories : menuData.categories.filter(c => c.id === currentCategory);
            if (currentCategory === 'all' && !menuData.categories.length) { renderItemList(container, menuData.items); return; }
            cats.forEach(cat => {
                const catItems = menuData.items.filter(i => i.category_id === cat.id);
                if (!catItems.length) return;
                const section = document.createElement('div'); section.className = 'mb-6';
                section.innerHTML = `<div class="flex items-center gap-3 mb-4 px-1"><div class="w-1 h-5 rounded-full bg-neon"></div><h2 class="text-sm font-bold text-white uppercase tracking-[0.15em]">${cat.name}</h2><div class="flex-1 h-px bg-white/5"></div></div>`;
                renderItemList(section, catItems); container.appendChild(section);
            });
            const uncategorized = menuData.items.filter(i => !i.category_id);
            if (uncategorized.length && currentCategory === 'all') {
                const section = document.createElement('div'); section.className = 'mb-6';
                section.innerHTML = `<div class="flex items-center gap-3 mb-4 px-1"><div class="w-1 h-5 rounded-full bg-cyber"></div><h2 class="text-sm font-bold text-white uppercase tracking-[0.15em]">Other</h2><div class="flex-1 h-px bg-white/5"></div></div>`;
                renderItemList(section, uncategorized); container.appendChild(section);
            }
            lucide.createIcons();
        }

        function renderItemList(container, items) {
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'menu-item-card glass rounded-2xl p-4 mb-3 neon-border-hover';
                const inCart = cart[item.id];
                div.innerHTML = `
                    <div class="flex gap-4">
                        <div class="w-20 h-20 rounded-xl img-placeholder flex-shrink-0 flex items-center justify-center overflow-hidden ${item.image_url ? '' : 'img-placeholder'}">
                            ${item.image_url ? `<img src="${item.image_url}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<i data-lucide=\'utensils\' class=\'w-6 h-6 text-neon/30\'></i>';lucide.createIcons();">` : '<i data-lucide="utensils" class="w-6 h-6 text-neon/30"></i>'}
                        </div>
                        <div class="flex-1 min-w-0 flex flex-col justify-between">
                            <div>
                                <div class="text-base font-semibold text-white leading-tight mb-1">${item.name}</div>
                                ${item.description ? `<div class="text-xs text-muted leading-relaxed line-clamp-2">${item.description}</div>` : ''}
                            </div>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-lg font-bold text-neon font-mono neon-text-subtle">$${parseFloat(item.price).toFixed(2)}</span>
                                ${inCart ? `
                                    <div class="flex items-center gap-2">
                                        <button onclick="updateQty('${item.id}', -1)" class="qty-btn-cyber w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-neon">
                                            <i data-lucide="minus" class="w-3.5 h-3.5"></i>
                                        </button>
                                        <span class="w-6 text-center text-sm font-bold text-white font-mono">${inCart.quantity}</span>
                                        <button onclick="updateQty('${item.id}', 1)" class="qty-btn-cyber w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center text-neon">
                                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                ` : `
                                    <button onclick="addToCart('${item.id}')" class="add-btn-glow w-9 h-9 rounded-xl flex items-center justify-center text-obsidian">
                                        <i data-lucide="plus" class="w-5 h-5"></i>
                                    </button>
                                `}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterCategory(catId) {
            currentCategory = catId;
            document.querySelectorAll('.cat-pill').forEach(btn => {
                const isActive = btn.dataset.cat === catId;
                if (isActive) {
                    btn.className = 'cat-pill active px-5 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap cursor-pointer border border-neon/30 text-neon bg-neon/10';
                } else {
                    btn.className = 'cat-pill px-5 py-2.5 rounded-full text-sm font-semibold whitespace-nowrap cursor-pointer border border-white/10 text-muted-light bg-white/5 hover:border-neon/30 hover:text-neon transition-all';
                }
            });
            renderMenu();
        }

        function addToCart(itemId) {
            const item = menuData.items.find(i => i.id === itemId);
            if (!item) return;
            cart[itemId] = { item, quantity: 1, note: '' };
            updateCartUI(); renderMenu();
        }

        function updateQty(itemId, delta) {
            if (!cart[itemId]) return;
            cart[itemId].quantity += delta;
            if (cart[itemId].quantity <= 0) delete cart[itemId];
            updateCartUI(); renderMenu(); renderCartItems();
        }

        function updateNote(itemId, note) { if (cart[itemId]) cart[itemId].note = note; }

        function updateCartUI() {
            const count = Object.values(cart).reduce((sum, c) => sum + c.quantity, 0);
            const total = Object.values(cart).reduce((sum, c) => sum + (c.quantity * c.item.price), 0);
            const bar = document.getElementById('cart-bar');
            if (count > 0) {
                bar.classList.remove('hidden');
                bar.classList.add('flex');
                document.getElementById('cart-count').textContent = `${count} item${count !== 1 ? 's' : ''}`;
                document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;
            } else {
                bar.classList.add('hidden');
                bar.classList.remove('flex');
            }
        }

        function openCart() { renderCartItems(); document.getElementById('cart-modal-overlay').classList.remove('hidden'); document.getElementById('cart-modal-overlay').classList.add('flex'); document.body.style.overflow = 'hidden'; lucide.createIcons(); }
        function closeCart(event) { if (event && event.target !== document.getElementById('cart-modal-overlay')) return; document.getElementById('cart-modal-overlay').classList.add('hidden'); document.getElementById('cart-modal-overlay').classList.remove('flex'); document.body.style.overflow = ''; }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            const items = Object.values(cart);
            if (!items.length) {
                container.innerHTML = '<div class="text-center py-12 text-muted"><i data-lucide="shopping-bag" class="w-10 h-10 mx-auto mb-3 opacity-20"></i><p>Your cart is empty</p></div>';
                document.getElementById('place-order-btn').disabled = true;
                document.getElementById('place-order-btn').classList.add('opacity-50');
                lucide.createIcons();
                return;
            }
            let html = ''; let subtotal = 0; let totalCount = 0;
            items.forEach(c => {
                const lineTotal = c.quantity * c.item.price; subtotal += lineTotal; totalCount += c.quantity;
                html += `
                    <div class="py-4 border-b border-white/5">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex-1 min-w-0 pr-3">
                                <div class="text-sm font-semibold text-white mb-0.5">${c.item.name}</div>
                                <div class="text-xs text-muted font-mono">$${c.item.price.toFixed(2)} each</div>
                            </div>
                            <div class="text-sm font-bold text-neon font-mono">$${lineTotal.toFixed(2)}</div>
                        </div>
                        <div class="flex justify-between items-center mt-2">
                            <div class="flex items-center gap-2">
                                <button onclick="updateQty('${c.item.id}', -1)" class="qty-btn-cyber w-7 h-7 rounded-lg bg-white/5 flex items-center justify-center text-neon">
                                    <i data-lucide="minus" class="w-3 h-3"></i>
                                </button>
                                <span class="w-6 text-center text-sm font-bold text-white font-mono">${c.quantity}</span>
                                <button onclick="updateQty('${c.item.id}', 1)" class="qty-btn-cyber w-7 h-7 rounded-lg bg-white/5 flex items-center justify-center text-neon">
                                    <i data-lucide="plus" class="w-3 h-3"></i>
                                </button>
                            </div>
                            <textarea class="note-area w-32 h-7 rounded-lg px-2 py-1 text-[11px] text-muted-light resize-none" placeholder="Note..." onchange="updateNote('${c.item.id}', this.value)">${c.note || ''}</textarea>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('cart-subtotal').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('cart-grand-total').textContent = `$${subtotal.toFixed(2)}`;
            document.getElementById('cart-modal-count').textContent = `${totalCount} item${totalCount !== 1 ? 's' : ''}`;
            document.getElementById('place-order-btn').disabled = false;
            document.getElementById('place-order-btn').classList.remove('opacity-50');
            lucide.createIcons();
        }

        async function placeOrder() {
            const btn = document.getElementById('place-order-btn');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            try {
                const { data: order, error: orderError } = await sb.from('orders').insert([{ table_id: tableId, status: 'pending' }]).select().single();
                if (orderError) throw orderError;
                const items = Object.values(cart).map(c => ({ order_id: order.id, menu_item_id: c.item.id, quantity: c.quantity, price_at_time: c.item.price, notes: c.note || null }));
                const { error: itemsError } = await sb.from('order_items').insert(items);
                if (itemsError) throw itemsError;
                cart = {}; updateCartUI(); closeCart();
                document.getElementById('success-screen').classList.remove('hidden');
                document.getElementById('success-screen').classList.add('flex');
            } catch (e) {
                console.error('Order error:', e);
                alert('Failed to place order. Please try again.');
                btn.disabled = false;
                btn.textContent = 'Place Order';
            }
        }

        function resetOrder() {
            document.getElementById('success-screen').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('flex');
            renderMenu();
        }

        function showError(title, text) {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('error-title').textContent = title;
            document.getElementById('error-text').textContent = text;
            document.getElementById('error-screen').classList.remove('hidden');
            document.getElementById('error-screen').classList.add('flex');
            lucide.createIcons();
        }
    </script>
</body>
</html>
